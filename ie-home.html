<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Welcome to Microsoft's Homepage - Microsoft Internet Explorer</title>
  <style>
    html, body {
      height: 100%;
      margin: 0;
      font-family: Tahoma, "Segoe UI", sans-serif;
      background: #fff;
      color: #000;
    }

    .ms-home {
      padding: 18px 18px 24px;
    }

    .ms-logo {
      font-size: 56px;
      line-height: 1;
      font-style: italic;
      font-weight: 700;
      color: #0055E0;
      letter-spacing: -1px;
      margin: 6px 0 10px;
    }

    .ms-tagline {
      font-size: 14px;
      color: #333;
      margin: 0;
    }

    .ms-rule {
      height: 1px;
      background: #d9d9d9;
      margin: 14px 0;
    }

    .ms-note {
      font-size: 12px;
      color: #555;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="ms-home">
    <div class="ms-logo">Microsoft</div>
    <p class="ms-tagline">Welcome to Microsoft's Homepage</p>
    <div class="ms-rule" aria-hidden="true"></div>
    <p class="ms-note">(IE6 Luna UI recreation — non-functional)</p>
  </div>
</body>
</html>
