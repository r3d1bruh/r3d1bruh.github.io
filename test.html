        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .container {
            text-align: center;
            background: rgba(255, 0, 0, 0.171); /* Make the background darker */
            padding: 50px; /* Increase padding */
            border-radius: 30px;
            box-shadow: 0 0 20px rgb(255, 0, 0); /* Stronger shadow */
            z-index: 1;
            width: 400px; /* Fixed width */
        }
        .title {
            font-size: 2em; /* Larger title */
            color: white;
        }
        .links-container {
            display: flex;
            flex-direction: column;
            gap: 10px; /* Adjust spacing between items */
        }
        .link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 1px 0;
            padding: 15px; /* Increase padding */
            background: #00000042;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.3s, box-shadow 0.3s, transform 0.3s, margin-top 0.3s; /* Smooth transition for margin */
        }
        .link img {
            margin-right: 10px;
            width: 32px; /* Larger icons */
            height: 32px;
            z-index: 1; /* Ensure image is above glow effect */
        }
        .link::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            border-radius: 10px;
            background: rgba(255, 0, 0, 0.308);
            z-index: -1;
            transition: transform 0.3s;
        }
        .link:hover::before {
            animation: hueGlow 2s infinite alternate;
        }
        .link:hover {
            transform: scale(1.1);
        }
        .link:not(:hover) {
            transform: scale(0.9);
        }
        .link:hover ~ .link {
            margin-top: 15px; /* Add space when hovering */
        }
        @keyframes hueGlow {
            0% {
                filter: hue-rotate(0deg);
            }
            100% {
                filter: hue-rotate(360deg);
            }
        }
        .small-text {
            font-size: 1em;
            color: white;
            background: rgba(0, 0, 0, 0);
            padding: 0px;
            border-radius: 0px;
        }
    </style>
