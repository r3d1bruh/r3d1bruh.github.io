<!DOCTYPE html>

<head>

    <title>My Social Links</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
        .background-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1;
        }
        .container {
            text-align: center;
            background: rgba(0, 0, 0, 0.479); /* Make the background darker */
            padding: 50px; /* Increase padding */
            border-radius: 30px;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5); /* Stronger shadow */
            z-index: 1;
            width: 500px; /* Double the width */
        }
        .title {
            font-size: 2em; /* Larger title */
            color: white;
        }
        .link {
            display: flex;
            align-items: center;
            justify-content: center;
            margin: 10px 0;
            padding: 15px; /* Increase padding */
            background: #00000042;
            color: white;
            text-decoration: none;
            border-radius: 10px;
            transition: background 0.3s, box-shadow 0.3s, transform 0.3s;
        }
        .link img {
            margin-right: 10px;
            width: 32px; /* Larger icons */
            height: 32px;
            border-radius: 50%;
        }
        .link:hover {
            background: #00000098;
            box-shadow: 0 0 30px rgba(255, 0, 0, 0.8);
            animation: glow 3s infinite alternate;
            transform: scale(1.1);
        }
        @keyframes glow {
            0% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
                filter: hue-rotate(0deg);
            }
            100% {
                box-shadow: 0 0 10px rgba(255, 0, 0, 0.8);
                filter: hue-rotate(360deg);
            }
        }
        .small-text {
            /*margin-top: 20px;*/
            font-size: 1em;
            color: white;
            background: rgba(0, 0, 0, 0);
            padding: 0px;
            border-radius: 0px;
        }
    </style>
</head>
