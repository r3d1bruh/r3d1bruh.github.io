<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Redirecting…</title>
    <meta http-equiv="refresh" content="0; url=links.html" />
    <link rel="canonical" href="links.html" />
    <script>
      // JS redirect as a fallback (and preserves query string for embed mode).
      const qs = location.search || '';
      location.replace('links.html' + qs);
    </script>
  </head>
  <body>
    <p>
      Moved to <a href="links.html">links.html</a>.
    </p>
  </body>
</html>
