<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Attendance Tracker</title>
    <link rel="manifest" href="manifest.json">
    <meta name="theme-color" content="#fb7185">
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff1f2;
            font-size: 16px;
            line-height: 1.35;
        }

        /* Mobile/touch polish (Chrome Android) */
        html {
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #fecdd3;
        }

        .day-cell {
            transition: all 0.2s ease;
            position: relative;
        }

        .day-cell:hover:not(.disabled) {
            transform: scale(1.05);
        }

        @media (max-width: 420px) {
            .day-cell:hover:not(.disabled) {
                transform: none;
            }
        }

        .checked {
            background-color: #fb7185 !important;
            color: white !important;
            border-color: #e11d48 !important;
        }



        .star-anim {
            animation: star-pop 0.3s ease-out;
        }

        @keyframes star-pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .profile-img {
            width: 100px;
            height: 100px;
            aspect-ratio: 1 / 1;
            object-fit: contain;
            object-position: center;
            background-color: #ffffff;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 110;
            padding: 20px;
        }

        /* Layout wrapper (mobile-first) */
        .desktop-split {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        /* Flatten right stack on mobile so we can reorder */
        .right-stack {
            display: contents;
        }

        .intro-block { order: 1; }
        .calendar-card { order: 2; }
        .stats-card { order: 3; }
        .sync-block { order: 4; }

        /* Desktop layout: calendar left, everything else right */
        @media (min-width: 460px) and (hover: hover) and (pointer: fine) {
            .desktop-split {
                display: grid;
                grid-template-columns: minmax(0, 1fr) minmax(240px, 340px);
                column-gap: clamp(10px, 2vw, 20px);
                row-gap: 12px;
                align-items: start;
            }

            .right-stack {
                display: flex;
                flex-direction: column;
                gap: 12px;
                grid-column: 2;
                grid-row: 1;
            }

            /* Push sync to bottom when right column is stretched */
            .sync-block {
                margin-top: auto !important;
            }

            .calendar-card {
                grid-column: 1;
                grid-row: 1;
            }

            .intro-block,
            .stats-card,
            .sync-block {
                margin-top: 0 !important;
                margin-bottom: 0 !important;
            }

            #sync-status {
                margin-top: 0 !important;
            }
        }

        @supports (padding: env(safe-area-inset-top)) {
            .modal-bg {
                padding: calc(env(safe-area-inset-top) + 20px)
                        calc(env(safe-area-inset-right) + 20px)
                        calc(env(safe-area-inset-bottom) + 20px)
                        calc(env(safe-area-inset-left) + 20px);
            }
        }
    </style>
</head>
<body class="min-h-screen p-0 sm:p-4 md:p-8 flex flex-col items-center">

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-bg">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-user-lock"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Admin Login Required</h3>
            <p class="text-gray-500 text-sm mb-6">Attendance is public, but you need to sign in to make changes.</p>
            <div class="space-y-3">
                <button id="google-signin-btn" class="w-full bg-white border-2 border-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                    Sign in with Google
                </button>
                <button onclick="closeAuthModal()" class="w-full py-2 text-gray-400 text-sm font-medium">Cancel</button>
            </div>
        </div>
    </div>


    <div class="max-w-2xl lg:max-w-5xl w-full px-1 sm:px-0">
        <div class="desktop-split">

        <div class="right-stack">
            <!-- Intro (mobile first, right column on desktop) -->
            <div class="intro-block text-center mb-4">
                <div class="inline-flex items-center gap-3 mb-2">
                    <a href="anushkaverse.html" aria-label="Open Anushkaverse gallery" title="Open Anushkaverse gallery">
                        <img src="dora.webp" 
                            alt="Dora" 
                            class="profile-img rounded-full w-[76px] h-[76px] sm:w-[88px] sm:h-[88px]">
                    </a>
                    <div class="bg-white/70 border border-rose-100 rounded-2xl px-3 py-2 shadow-sm">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-fire text-rose-400"></i>
                            <div class="text-left leading-tight">
                                <div class="text-[11px] font-bold text-gray-600">Best Streak</div>
                                <div class="text-2xl font-extrabold text-rose-500" id="month-best-streak">0</div>
                            </div>
                        </div>
                    </div>
                </div>
                <h1 class="text-3xl sm:text-3xl font-bold text-rose-600 mb-1">Dora's Attendance ⭐</h1>
                <p class="text-rose-400 font-medium italic text-sm sm:text-sm">Tracking the yaps XD</p>
                
                <div id="user-chip" class="mt-2 inline-flex items-center gap-2 bg-white/50 px-3 py-1 rounded-full text-xs sm:text-[10px] font-bold text-rose-400 border border-rose-100 max-w-full">
                    <i class="fas fa-eye"></i> PUBLIC VIEW
                </div>
            </div>

            <!-- Month Stats (below calendar on mobile via order, right column on desktop) -->
            <div class="card stats-card rounded-3xl p-4 sm:p-6 shadow-sm mt-4">
                <div class="text-sm font-bold text-gray-700 mb-3">This Month</div>
                <div class="grid grid-cols-2 gap-4 text-center">
                    <div class="bg-white/60 rounded-2xl p-3 border border-rose-100 col-span-2">
                        <div class="text-3xl font-extrabold text-rose-500 leading-none" id="month-talked">0</div>
                        <div class="mt-1 text-sm font-semibold text-gray-600">Talked / Total</div>
                    </div>
                    <div class="bg-white/60 rounded-2xl p-3 border border-rose-100">
                        <div class="text-3xl font-extrabold text-rose-500 leading-none" id="month-missed">0</div>
                        <div class="mt-1 text-sm font-semibold text-gray-600">Missed Days</div>
                    </div>
                    <div class="bg-white/60 rounded-2xl p-3 border border-rose-100">
                        <div class="text-3xl font-extrabold text-rose-500 leading-none" id="month-rate">0%</div>
                        <div class="mt-1 text-sm font-semibold text-gray-600">Hit Rate</div>
                    </div>
                </div>
            </div>

            <div class="sync-block">
                <div id="sync-status" class="mt-6 text-center text-xs sm:text-[10px] text-rose-300 font-bold uppercase tracking-widest">
                    <i class="fas fa-cloud"></i> Synced with Cloud
                </div>
                
                <button id="sign-out-btn" class="hidden mx-auto mt-3 text-rose-300 text-xs sm:text-[10px] font-bold uppercase hover:text-rose-500 underline">Sign Out</button>
            </div>
        </div>

        <!-- Calendar Card -->
        <div class="card calendar-card rounded-3xl p-3 sm:p-6 shadow-md">
            <div class="flex flex-wrap justify-between items-center gap-2 mb-4 sm:mb-6">
                <h2 class="w-full sm:w-auto text-xl sm:text-xl font-semibold text-gray-700" id="month-display">Loading...</h2>
                <div class="flex gap-2 ml-auto">
                    <button id="prev-btn" class="w-10 h-10 grid place-items-center hover:bg-rose-50 rounded-full transition-colors" aria-label="Previous month"><i class="fas fa-chevron-left text-rose-400"></i></button>
                    <button id="next-btn" class="w-10 h-10 grid place-items-center hover:bg-rose-50 rounded-full transition-colors" aria-label="Next month"><i class="fas fa-chevron-right text-rose-400"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-2 text-center mb-2">
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">S</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">M</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">T</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">W</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">T</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">F</div>
                <div class="text-sm sm:text-xs font-bold text-gray-400 uppercase">S</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-1.5 sm:gap-2"></div>
        </div>

        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC0VH6FcJ_YrSC_bbWdUC0KsHvRhuueNVY",
            authDomain: "dora-8aa96.firebaseapp.com",
            projectId: "dora-8aa96",
            storageBucket: "dora-8aa96.firebasestorage.app",
            messagingSenderId: "582926556937",
            appId: "1:582926556937:web:8388a1f5af6c10a5633dd8"
        };

        // If you want to restrict who can edit, add emails here:
        // const ALLOWED_EMAILS = ['ohpajn@gmail.com']; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const MY_DOC_ID = "main_attendance_tracker";
        const START_DATE = new Date(2025, 2, 19); // March 19, 2025

        let currentDate = new Date();
        let callData = {};
        let currentUser = null;

        // UI Elements
        const authModal = document.getElementById('auth-modal');
        const userChip = document.getElementById('user-chip');
        const signOutBtn = document.getElementById('sign-out-btn');

        function computeCurrentStreak() {
            let streak = 0;
            let checkDate = new Date();
            checkDate.setHours(0, 0, 0, 0);

            while (true) {
                const key = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
                if (callData[key]) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    if (streak === 0 && checkDate.toDateString() === new Date().toDateString()) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }
                    break;
                }
            }
            return streak;
        }

        function getMostRecentStarredKey() {
            let latestKey = null;
            for (const key of Object.keys(callData)) {
                if (!callData[key]) continue;
                if (!latestKey || key > latestKey) latestKey = key;
            }
            return latestKey;
        }

        function setUserChip(isAdmin, labelText) {
            userChip.innerHTML = '';
            const icon = document.createElement('i');
            icon.className = isAdmin ? 'fas fa-unlock' : 'fas fa-eye';
            userChip.appendChild(icon);
            userChip.appendChild(document.createTextNode(' ' + labelText));
        }


        function fireConfetti() {
            try {
                if (typeof window.confetti !== 'function') return;
                window.confetti({
                    particleCount: 120,
                    spread: 70,
                    origin: { y: 0.65 },
                });
            } catch {
                // ignore
            }
        }

        function getMonthKeyRange(year, monthIndex) {
            const start = new Date(year, monthIndex, 1);
            const end = new Date(year, monthIndex + 1, 0);
            start.setHours(0, 0, 0, 0);
            end.setHours(0, 0, 0, 0);
            return { start, end };
        }

        function dateToKey(d) {
            const y = d.getFullYear();
            const m = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return `${y}-${m}-${day}`;
        }

        function computeAllTimeBestStreak() {
            const activeKeys = Object.keys(callData)
                .filter((key) => callData[key])
                .sort();

            if (!activeKeys.length) return 0;

            let best = 1;
            let current = 1;

            for (let i = 1; i < activeKeys.length; i++) {
                const prevDate = new Date(`${activeKeys[i - 1]}T00:00:00`);
                const currDate = new Date(`${activeKeys[i]}T00:00:00`);
                const diffDays = Math.round((currDate - prevDate) / 86400000);

                if (diffDays === 1) {
                    current += 1;
                    best = Math.max(best, current);
                } else if (diffDays > 1) {
                    current = 1;
                }
            }

            return best;
        }

        function updateMonthStats() {
            const mTalked = document.getElementById('month-talked');
            const mMissed = document.getElementById('month-missed');
            const mRate = document.getElementById('month-rate');
            const mBestStreak = document.getElementById('month-best-streak');
            if (!mTalked || !mMissed || !mRate || !mBestStreak) return;

            const year = currentDate.getFullYear();
            const monthIndex = currentDate.getMonth();
            const { start: monthStart, end: monthEnd } = getMonthKeyRange(year, monthIndex);

            const today = new Date();
            today.setHours(0, 0, 0, 0);

            const eligibleStart = new Date(Math.max(monthStart.getTime(), START_DATE.getTime()));
            eligibleStart.setHours(0, 0, 0, 0);

            const eligibleEnd = new Date(Math.min(monthEnd.getTime(), today.getTime()));
            eligibleEnd.setHours(0, 0, 0, 0);

            let eligibleDays = 0;
            let talkedDays = 0;

            if (eligibleStart <= eligibleEnd) {
                const d = new Date(eligibleStart);
                while (d <= eligibleEnd) {
                    eligibleDays += 1;
                    const key = dateToKey(d);
                    if (callData[key]) talkedDays += 1;
                    d.setDate(d.getDate() + 1);
                }
            }

            const missedDays = Math.max(0, eligibleDays - talkedDays);
            const rate = eligibleDays ? Math.round((talkedDays / eligibleDays) * 1000) / 10 : 0;
            const bestStreak = computeAllTimeBestStreak();

            mTalked.textContent = `${talkedDays}/${eligibleDays}`;
            mMissed.textContent = String(missedDays);
            mRate.textContent = `${rate}%`;
            mBestStreak.textContent = String(bestStreak);
        }

        // Initial Load
        const init = () => {
            // 1. Set up Auth Listener
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    const label = `ADMIN: ${user.displayName || user.email || 'User'}`;
                    setUserChip(true, label);
                    signOutBtn.classList.remove('hidden');
                    closeAuthModal();
                } else {
                    setUserChip(false, 'PUBLIC VIEW');
                    signOutBtn.classList.add('hidden');
                }
                renderCalendar();
            });

            // 2. Set up Firestore Real-time Listener (Publicly accessible)
            const docRef = doc(db, 'user_data', MY_DOC_ID);
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    callData = data.records || {};
                }
                renderCalendar();
            });
        };

        // Render Logic
        window.renderCalendar = function() {
            const grid = document.getElementById('calendar-grid');
            const monthDisplay = document.getElementById('month-display');
            grid.innerHTML = '';

            const mostRecentStarredKey = getMostRecentStarredKey();
            const currentStreak = computeCurrentStreak();

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            monthDisplay.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            // Leading blanks must keep their square size so rows line up uniformly.
            for (let i = 0; i < firstDay; i++) {
                const blank = document.createElement('div');
                blank.className = 'day-cell aspect-square rounded-xl border-2 border-transparent pointer-events-none opacity-0';
                grid.appendChild(blank);
            }

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cell = document.createElement('div');
                cell.className = `day-cell aspect-square flex flex-col items-center justify-center rounded-xl border-2 text-base sm:text-sm font-bold transition-all`;
                cell.innerText = day;

                // Disable days before start date
                if (dateObj < START_DATE && dateObj.toDateString() !== START_DATE.toDateString()) {
                    cell.className += ' opacity-10 grayscale pointer-events-none bg-gray-50 border-transparent';
                } else {
                    if (callData[dateKey]) {
                        cell.classList.add('checked', 'star-anim');
                        if (mostRecentStarredKey && dateKey === mostRecentStarredKey && currentStreak > 0) {
                            cell.innerHTML = `<div class="flex items-center gap-1 text-lg sm:text-base font-black"><i class="fas fa-fire text-yellow-300"></i> ${currentStreak}</div>`;
                        } else {
                            cell.innerHTML = `<i class="fas fa-star text-yellow-300 text-sm sm:text-xs"></i>`;
                        }
                    } else {
                        cell.classList.add('bg-white', 'text-rose-800', 'border-rose-50');
                    }

                    // Click Behavior
                    cell.onclick = () => {
                        if (!currentUser) {
                            openAuthModal();
                        } else {
                            toggleDay(dateKey);
                        }
                    };
                }

                // Highlight Today
                if (dateObj.toDateString() === new Date().toDateString()) {
                    cell.style.boxShadow = "0 0 0 2px #fda4af";
                }
                
                grid.appendChild(cell);
            }
            updateMonthStats();
            queueDesktopHeightsSync();
        };

        const desktopLayoutMq = window.matchMedia('(min-width: 460px) and (hover: hover) and (pointer: fine)');
        let desktopHeightsSyncRaf = 0;

        function syncDesktopHeights() {
            const rightStack = document.querySelector('.right-stack');
            const calendarCard = document.querySelector('.calendar-card');
            if (!rightStack || !calendarCard) return;

            if (!desktopLayoutMq.matches) {
                rightStack.style.minHeight = '';
                return;
            }

            const calendarHeight = calendarCard.getBoundingClientRect().height;
            rightStack.style.minHeight = `${calendarHeight}px`;
        }

        function queueDesktopHeightsSync() {
            if (desktopHeightsSyncRaf) cancelAnimationFrame(desktopHeightsSyncRaf);
            desktopHeightsSyncRaf = requestAnimationFrame(() => {
                desktopHeightsSyncRaf = 0;
                syncDesktopHeights();
            });
        }

        window.addEventListener('resize', queueDesktopHeightsSync);
        desktopLayoutMq.addEventListener('change', queueDesktopHeightsSync);
        window.addEventListener('load', queueDesktopHeightsSync);

        async function toggleDay(dateKey) {
            const wasStarred = !!callData[dateKey];
            callData[dateKey] = !wasStarred;
            renderCalendar();
            if (!wasStarred && callData[dateKey]) fireConfetti();
            saveData();
        }

        async function saveData() {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, 'user_data', MY_DOC_ID), { 
                    records: callData
                }, { merge: true });
            } catch (e) {
                console.error("Save failed:", e);
                alert("Cloud save failed. Check console for errors.");
            }
        }

        // Modals & Auth Actions
        window.openAuthModal = () => authModal.style.display = 'flex';
        window.closeAuthModal = () => authModal.style.display = 'none';


        document.getElementById('google-signin-btn').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                console.error("Login Error:", e);
            }
        };

        signOutBtn.onclick = () => signOut(auth);

        document.getElementById('prev-btn').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('next-btn').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };

        init();
    </script>
</body>
</html>
