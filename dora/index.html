<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dora's Attendance Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Quicksand:wght@400;600;700&display=swap');
        
        body {
            font-family: 'Quicksand', sans-serif;
            background-color: #fff1f2;
        }

        .card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 2px solid #fecdd3;
        }

        .day-cell {
            transition: all 0.2s ease;
            position: relative;
        }

        .day-cell:hover:not(.disabled) {
            transform: scale(1.05);
        }

        .checked {
            background-color: #fb7185 !important;
            color: white !important;
            border-color: #e11d48 !important;
        }



        .star-anim {
            animation: star-pop 0.3s ease-out;
        }

        @keyframes star-pop {
            0% { transform: scale(0.5); opacity: 0; }
            50% { transform: scale(1.2); }
            100% { transform: scale(1); opacity: 1; }
        }

        .profile-img {
            width: 100px;
            height: 100px;
            object-fit: cover;
            border: 4px solid white;
            box-shadow: 0 4px 10px rgba(225, 29, 72, 0.2);
        }

        .modal-bg {
            position: fixed;
            inset: 0;
            background: rgba(0,0,0,0.5);
            display: none;
            align-items: center;
            justify-content: center;
            z-index: 110;
            padding: 20px;
        }
    </style>
</head>
<body class="min-h-screen p-4 md:p-8 flex flex-col items-center">

    <!-- Auth Modal -->
    <div id="auth-modal" class="modal-bg">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full shadow-2xl text-center">
            <div class="w-16 h-16 bg-rose-100 text-rose-500 rounded-full flex items-center justify-center mx-auto mb-4 text-2xl">
                <i class="fas fa-user-lock"></i>
            </div>
            <h3 class="text-xl font-bold text-gray-800 mb-2">Admin Login Required</h3>
            <p class="text-gray-500 text-sm mb-6">Attendance is public, but you need to sign in to make changes.</p>
            <div class="space-y-3">
                <button id="google-signin-btn" class="w-full bg-white border-2 border-gray-100 text-gray-700 px-4 py-3 rounded-xl font-bold flex items-center justify-center gap-3 hover:bg-gray-50 transition-all">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/auth/google.svg" width="20" alt="Google">
                    Sign in with Google
                </button>
                <button onclick="closeAuthModal()" class="w-full py-2 text-gray-400 text-sm font-medium">Cancel</button>
            </div>
        </div>
    </div>


    <div class="max-w-2xl w-full">
        <div class="text-center mb-8">
            <div class="relative inline-block mb-4">
                <img src="https://api.dicebear.com/7.x/adventurer/svg?seed=Dora" 
                     alt="Dora" 
                     class="profile-img rounded-full mx-auto">
                <div class="absolute bottom-0 right-0 bg-yellow-400 rounded-full p-1 border-2 border-white">
                    <i class="fas fa-star text-white text-xs"></i>
                </div>
            </div>
            <h1 class="text-4xl font-bold text-rose-600 mb-2">Dora's Attendance ⭐</h1>
            <p class="text-rose-400 font-medium italic">Tracking the yaps since March 19th</p>
            
            <!-- User Status Chip -->
            <div id="user-chip" class="mt-4 inline-flex items-center gap-2 bg-white/50 px-3 py-1 rounded-full text-[10px] font-bold text-rose-400 border border-rose-100">
                <i class="fas fa-eye"></i> PUBLIC VIEW
            </div>
        </div>

        <!-- Stats Section -->
        <div class="card rounded-3xl p-6 mb-8 shadow-sm flex justify-around items-center text-center">
            <div>
                <span class="block text-3xl font-bold text-rose-500" id="streak-count">0</span>
                <span class="text-xs text-gray-500 uppercase tracking-wider font-bold">Streak</span>
            </div>
            <div class="h-12 w-px bg-rose-100"></div>
            <div>
                <span class="block text-3xl font-bold text-rose-500" id="total-calls">0</span>
                <span class="text-xs text-gray-500 uppercase tracking-wider font-bold">Total Stars</span>
            </div>
        </div>

        <!-- Calendar Card -->
        <div class="card rounded-3xl p-6 shadow-md">
            <div class="flex justify-between items-center mb-6">
                <h2 class="text-xl font-semibold text-gray-700" id="month-display">Loading...</h2>
                <div class="flex gap-2">
                    <button id="prev-btn" class="p-2 hover:bg-rose-50 rounded-full transition-colors"><i class="fas fa-chevron-left text-rose-400"></i></button>
                    <button id="next-btn" class="p-2 hover:bg-rose-50 rounded-full transition-colors"><i class="fas fa-chevron-right text-rose-400"></i></button>
                </div>
            </div>

            <div class="grid grid-cols-7 gap-2 text-center mb-2">
                <div class="text-xs font-bold text-gray-400 uppercase">S</div>
                <div class="text-xs font-bold text-gray-400 uppercase">M</div>
                <div class="text-xs font-bold text-gray-400 uppercase">T</div>
                <div class="text-xs font-bold text-gray-400 uppercase">W</div>
                <div class="text-xs font-bold text-gray-400 uppercase">T</div>
                <div class="text-xs font-bold text-gray-400 uppercase">F</div>
                <div class="text-xs font-bold text-gray-400 uppercase">S</div>
            </div>

            <div id="calendar-grid" class="grid grid-cols-7 gap-2"></div>
        </div>

        <div id="sync-status" class="mt-8 text-center text-[10px] text-rose-300 font-bold uppercase tracking-widest">
            <i class="fas fa-cloud"></i> Synced with Cloud
        </div>
        
        <button id="sign-out-btn" class="hidden mx-auto mt-4 text-rose-300 text-[10px] font-bold uppercase hover:text-rose-500 underline">Sign Out</button>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, doc, setDoc, onSnapshot } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        // APP CONFIG
        const firebaseConfig = {
            apiKey: "AIzaSyC0VH6FcJ_YrSC_bbWdUC0KsHvRhuueNVY",
            authDomain: "dora-8aa96.firebaseapp.com",
            projectId: "dora-8aa96",
            storageBucket: "dora-8aa96.firebasestorage.app",
            messagingSenderId: "582926556937",
            appId: "1:582926556937:web:8388a1f5af6c10a5633dd8"
        };

        // If you want to restrict who can edit, add emails here:
        // const ALLOWED_EMAILS = ['ohpajn@gmail.com']; 

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        const MY_DOC_ID = "main_attendance_tracker";
        const START_DATE = new Date(2025, 2, 19); // March 19, 2025

        let currentDate = new Date();
        let callData = {};
        let currentUser = null;

        // UI Elements
        const authModal = document.getElementById('auth-modal');
        const userChip = document.getElementById('user-chip');
        const signOutBtn = document.getElementById('sign-out-btn');

        // Initial Load
        const init = () => {
            // 1. Set up Auth Listener
            onAuthStateChanged(auth, (user) => {
                currentUser = user;
                if (user) {
                    userChip.innerHTML = `<i class="fas fa-unlock"></i> ADMIN: ${user.displayName || 'User'}`;
                    signOutBtn.classList.remove('hidden');
                    closeAuthModal();
                } else {
                    userChip.innerHTML = `<i class="fas fa-eye"></i> PUBLIC VIEW`;
                    signOutBtn.classList.add('hidden');
                }
                renderCalendar();
            });

            // 2. Set up Firestore Real-time Listener (Publicly accessible)
            const docRef = doc(db, 'user_data', MY_DOC_ID);
            onSnapshot(docRef, (docSnap) => {
                if (docSnap.exists()) {
                    const data = docSnap.data();
                    callData = data.records || {};
                }
                renderCalendar();
            });
        };

        // Render Logic
        window.renderCalendar = function() {
            const grid = document.getElementById('calendar-grid');
            const monthDisplay = document.getElementById('month-display');
            grid.innerHTML = '';

            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();
            monthDisplay.innerText = new Intl.DateTimeFormat('en-US', { month: 'long', year: 'numeric' }).format(currentDate);

            const firstDay = new Date(year, month, 1).getDay();
            const daysInMonth = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDay; i++) grid.appendChild(document.createElement('div'));

            for (let day = 1; day <= daysInMonth; day++) {
                const dateObj = new Date(year, month, day);
                const dateKey = `${year}-${String(month + 1).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
                
                const cell = document.createElement('div');
                cell.className = `day-cell aspect-square flex flex-col items-center justify-center rounded-xl border-2 text-sm font-bold transition-all`;
                cell.innerText = day;

                // Disable days before start date
                if (dateObj < START_DATE && dateObj.toDateString() !== START_DATE.toDateString()) {
                    cell.className += ' opacity-10 grayscale pointer-events-none bg-gray-50 border-transparent';
                } else {
                    if (callData[dateKey]) {
                        cell.classList.add('checked', 'star-anim');
                        cell.innerHTML = `<i class="fas fa-star text-yellow-300 text-xs"></i>`;
                    } else {
                        cell.classList.add('bg-white', 'text-rose-800', 'border-rose-50');
                    }

                    // Click Behavior
                    cell.onclick = () => {
                        if (!currentUser) {
                            openAuthModal();
                        } else {
                            toggleDay(dateKey);
                        }
                    };
                }

                // Highlight Today
                if (dateObj.toDateString() === new Date().toDateString()) {
                    cell.style.boxShadow = "0 0 0 2px #fda4af";
                }
                
                grid.appendChild(cell);
            }
            updateStats();
        };

        async function toggleDay(dateKey) {
            callData[dateKey] = !callData[dateKey];
            saveData();
        }

        async function saveData() {
            if (!currentUser) return;
            try {
                await setDoc(doc(db, 'user_data', MY_DOC_ID), { 
                    records: callData
                }, { merge: true });
            } catch (e) {
                console.error("Save failed:", e);
                alert("Cloud save failed. Check console for errors.");
            }
        }

        // Modals & Auth Actions
        window.openAuthModal = () => authModal.style.display = 'flex';
        window.closeAuthModal = () => authModal.style.display = 'none';


        document.getElementById('google-signin-btn').onclick = async () => {
            try {
                await signInWithPopup(auth, provider);
            } catch (e) {
                console.error("Login Error:", e);
            }
        };

        signOutBtn.onclick = () => signOut(auth);


        function updateStats() {
            const activeDates = Object.keys(callData).filter(k => callData[k]);
            document.getElementById('total-calls').innerText = activeDates.length;

            let streak = 0;
            let checkDate = new Date();
            checkDate.setHours(0,0,0,0);

            while (true) {
                const key = `${checkDate.getFullYear()}-${String(checkDate.getMonth() + 1).padStart(2, '0')}-${String(checkDate.getDate()).padStart(2, '0')}`;
                if (callData[key]) {
                    streak++;
                    checkDate.setDate(checkDate.getDate() - 1);
                } else {
                    // If today is empty, check yesterday to see if streak is still alive
                    if (streak === 0 && checkDate.toDateString() === new Date().toDateString()) {
                        checkDate.setDate(checkDate.getDate() - 1);
                        continue;
                    }
                    break;
                }
            }
            document.getElementById('streak-count').innerText = streak;
        }

        document.getElementById('prev-btn').onclick = () => { currentDate.setMonth(currentDate.getMonth() - 1); renderCalendar(); };
        document.getElementById('next-btn').onclick = () => { currentDate.setMonth(currentDate.getMonth() + 1); renderCalendar(); };

        init();
    </script>
</body>
</html>
