<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#fff8fb">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <title>Anushkaverse - Archive Gallery</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');

        :root {
            --bg-ink: #1f1438;
            --bg-violet: #3f2f73;
            --bg-blush: #ef8aa6;
            --surface: #fff8fb;
            --surface-2: #fff1f8;
            --line: #f5d9e5;
            --text-1: #2f1332;
            --text-2: #6e4b6f;
            --accent: #ff4d8d;
            --accent-2: #ff8b53;
            --shadow: 0 18px 40px rgba(41, 17, 52, 0.16);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        html {
            height: 100%;
            -webkit-text-size-adjust: 100%;
            text-size-adjust: 100%;
        }

        body {
            min-height: 100vh;
            min-height: 100dvh;
            font-family: 'IBM Plex Sans', sans-serif;
            color: var(--text-1);
            background: var(--surface);
            overflow: hidden;
            -webkit-tap-highlight-color: transparent;
            touch-action: manipulation;
        }

        .shell {
            height: 100vh;
            height: 100dvh;
            min-height: 100svh;
            width: 100vw;
            margin: 0 auto;
            padding:
                max(0px, env(safe-area-inset-top))
                max(0px, env(safe-area-inset-right))
                max(0px, env(safe-area-inset-bottom))
                max(0px, env(safe-area-inset-left));
            display: flex;
            flex-direction: column;
            gap: 0;
        }

        .window {
            display: none;
            align-items: center;
            gap: 12px;
            border-radius: 16px;
            padding: 10px 14px;
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffe9f2;
            backdrop-filter: blur(6px);
        }

        .dot {
            width: 11px;
            height: 11px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.35);
        }

        .dot:nth-child(1) { background: #ff8575; }
        .dot:nth-child(2) { background: #ffd86f; }
        .dot:nth-child(3) { background: #79e7a6; }

        .window-title {
            font-size: 13px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            font-weight: 600;
            opacity: 0.92;
        }

        .stage {
            flex: 1;
            border-radius: 0;
            background: var(--surface);
            border: none;
            box-shadow: none;
            display: flex;
            flex-direction: column;
            min-height: 0;
            overflow: hidden;
        }

        .header {
            padding: 20px 26px;
            border-bottom: 1px solid var(--line);
            background:
                linear-gradient(115deg, rgba(255, 102, 164, 0.08), transparent 45%),
                var(--surface);
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
        }

        .kicker {
            font-size: 11px;
            font-weight: 600;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: var(--text-2);
            margin-bottom: 5px;
        }

        h1 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.4rem, 2.7vw, 2.4rem);
            line-height: 1.05;
            letter-spacing: 0.01em;
        }

        .caption {
            font-size: 0.92rem;
            color: var(--text-2);
            max-width: 70ch;
        }

        .badge {
            flex-shrink: 0;
            border-radius: 999px;
            border: 1px solid var(--line);
            background: var(--surface-2);
            color: var(--text-2);
            padding: 8px 14px;
            font-size: 12px;
            font-weight: 600;
            letter-spacing: 0.04em;
            text-transform: uppercase;
        }

        .gallery-wrap {
            flex: 1;
            min-height: 0;
            overflow: auto;
            padding: clamp(10px, 1.1vw, 20px);
            -webkit-overflow-scrolling: touch;
            overscroll-behavior: contain;
        }

        .gallery-wrap::-webkit-scrollbar { width: 8px; }
        .gallery-wrap::-webkit-scrollbar-thumb {
            background: #efc4d8;
            border-radius: 100px;
        }

        .grid {
            column-width: clamp(140px, 14vw, 210px);
            column-gap: clamp(8px, 0.8vw, 14px);
        }

        .card {
            width: 100%;
            display: inline-block;
            margin: 0 0 14px;
            position: relative;
            border-radius: 16px;
            overflow: hidden;
            cursor: pointer;
            isolation: isolate;
            border: 1px solid #f1e4eb;
            background: #ffffff;
            box-shadow: 0 10px 26px rgba(33, 15, 41, 0.1);
            opacity: 0;
            break-inside: avoid;
            -webkit-column-break-inside: avoid;
            animation: cardIn 650ms cubic-bezier(0.23, 1, 0.32, 1) forwards;
        }

        .card img {
            width: 100%;
            height: auto;
            display: block;
            background: transparent;
            border-radius: inherit;
            transition: transform 350ms ease;
        }

        .card::before {
            content: "";
            position: absolute;
            inset: 0;
            background: linear-gradient(to top, rgba(22, 12, 37, 0.78) 0%, transparent 58%);
            z-index: 1;
            display: none;
        }

        .card:hover img { transform: scale(1.03); }

        .card-meta {
            position: static;
            z-index: 2;
            inset-inline: auto;
            bottom: auto;
            color: var(--text-1);
            background: #ffffff;
            padding: 12px 14px 14px;
        }

        .world {
            font-size: 10px;
            text-transform: uppercase;
            letter-spacing: 0.14em;
            opacity: 0.86;
            margin-bottom: 5px;
        }

        .name {
            font-family: 'Syne', sans-serif;
            font-size: 0.98rem;
            line-height: 1.25;
            font-weight: 700;
        }

        @keyframes cardIn {
            from {
                transform: translateY(10px);
                opacity: 0;
            }
            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        .modal {
            position: fixed;
            inset: 0;
            display: grid;
            place-items: center;
            padding: 0;
            background: rgba(16, 7, 28, 0.82);
            backdrop-filter: blur(8px);
            z-index: 50;
        }

        .modal.hidden { display: none; }

        .dialog {
            width: 100%;
            height: 100%;
            max-height: 100dvh;
            background: #fff;
            border-radius: 0;
            overflow: hidden;
            position: relative;
            border: 0;
            box-shadow: none;
            animation: dialogIn 230ms ease-out;
        }

        .dialog.no-lore .dialog-info {
            transform: translateX(105%);
            opacity: 0;
            pointer-events: none;
        }

        @keyframes dialogIn {
            from {
                opacity: 0;
                transform: translateY(18px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dialog-media {
            background: #0e0818;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            padding: 0;
            position: relative;
        }

        .dialog-media img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            border-radius: 0;
        }

        .dialog-info {
            position: absolute;
            top: 0;
            right: 0;
            width: min(380px, 38vw);
            height: 100%;
            min-height: 0;
            display: flex;
            flex-direction: column;
            background: #fff8fb;
            border-left: 1px solid #f1dfe8;
            transition: transform 180ms ease, opacity 180ms ease;
        }

        .dialog-head {
            padding: 22px 24px 14px;
            border-bottom: 1px solid #f9e8f0;
            display: flex;
            justify-content: space-between;
            gap: 12px;
        }

        .dialog-head h2 {
            font-family: 'Syne', sans-serif;
            font-size: clamp(1.3rem, 2.4vw, 2rem);
            line-height: 1.1;
            margin-bottom: 5px;
        }

        .close {
            border: 0;
            background: #fff3f8;
            color: #b8618f;
            width: 34px;
            height: 34px;
            border-radius: 50%;
            font-size: 20px;
            line-height: 1;
            cursor: pointer;
            transition: transform 160ms ease, background-color 160ms ease;
            position: absolute;
            top: max(12px, calc(env(safe-area-inset-top) + 8px));
            left: max(12px, calc(env(safe-area-inset-left) + 8px));
            z-index: 60;
        }

        .close:hover {
            background: #ffe4f1;
            transform: rotate(90deg);
        }

        .dialog-body {
            padding: 22px 24px 26px;
            overflow: auto;
        }

        .dialog-body h3 {
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: #9a6f90;
            margin-bottom: 10px;
        }

        .dialog-body p {
            color: #5a3a5b;
            line-height: 1.72;
            font-size: 0.98rem;
        }

        @media (min-width: 761px) {
            .grid {
                column-width: clamp(220px, 20vw, 280px);
                column-gap: 16px;
            }
        }

        @media (max-width: 760px) {
            body {
                overflow: hidden;
            }

            .shell {
                min-height: 100dvh;
                height: 100dvh;
                padding: 0;
            }

            .header {
                padding: 16px;
                align-items: flex-start;
                flex-direction: column;
            }

            .gallery-wrap {
                flex: 1;
                min-height: 0;
                overflow-y: auto;
                overflow-x: hidden;
                -webkit-overflow-scrolling: touch;
                overscroll-behavior-y: contain;
                touch-action: pan-y;
                padding: 10px;
            }

            .stage {
                min-height: 0;
                overflow: hidden;
            }

            .badge {
                font-size: 10px;
                padding: 6px 10px;
            }

            .grid {
                column-count: 2;
                column-gap: 8px;
            }

            .card {
                margin: 0 0 10px;
                border-radius: 14px;
            }

            .card-meta {
                padding: 10px 10px 12px;
            }

            .name {
                font-size: 0.9rem;
                line-height: 1.2;
            }

            .dialog {
                height: 100dvh;
                max-height: 100dvh;
            }

            .dialog-media {
                max-height: 100dvh;
            }

            .dialog-body {
                padding: 16px;
            }

            .dialog-info {
                width: min(320px, 82vw);
            }

            .close {
                width: 38px;
                height: 38px;
            }
        }

        @media (max-width: 420px) {
            .header {
                padding: 12px;
            }

            h1 {
                font-size: 1.5rem;
            }

            .gallery-wrap {
                padding: 8px;
            }

            .grid {
                column-count: 2;
                column-gap: 6px;
            }

            .card {
                margin: 0 0 8px;
            }

            .name {
                font-size: 0.86rem;
            }
        }

        @media (max-height: 520px) and (orientation: landscape) {
            .dialog {
                max-height: 100dvh;
            }

            .dialog-media {
                max-height: none;
            }
        }
    </style>
</head>
<body>
    <div class="shell">
        <div class="window">
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="dot"></span>
            <span class="window-title">Anushkaverse Archive</span>
        </div>

        <section class="stage">
            <header class="header">
                <h1>Anushkaverse</h1>
                <div class="badge" id="variant-count">4 variants loaded</div>
            </header>

            <main class="gallery-wrap" id="gallery-container">
                <div class="grid" id="main-grid"></div>
            </main>
        </section>
    </div>

    <div id="modal" class="modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-label="Variant details">
        <article class="dialog">
            <div class="dialog-media">
                <button id="modal-close" class="close" type="button" aria-label="Close">+</button>
                <img id="modal-img" src="" alt="Variant portrait">
            </div>
            <div class="dialog-info">
                <div class="dialog-head">
                    <div>
                        <h2 id="modal-name"></h2>
                    </div>
                </div>
                <div class="dialog-body">
                    <h3>Archive Lore</h3>
                    <p id="modal-lore"></p>
                </div>
            </div>
        </article>
    </div>

    <script>
        let characters = [];

        const IMAGE_EXT_PATTERN = /\.(png|jpe?g|webp|gif|avif)$/i;

        function nameFromFilename(filePath) {
            const filename = filePath.split('/').pop() || filePath;
            const base = filename.replace(/\.[^/.]+$/, '');
            try {
                return decodeURIComponent(base);
            } catch {
                return base;
            }
        }

        function fallbackLore(filePath) {
            const name = nameFromFilename(filePath);
            return `Archive entry for ${name}. Add a custom lore field in gallery/manifest.json if you want richer text.`;
        }

        function normalizeGallerySrc(rawSrc) {
            const src = String(rawSrc || '').trim();
            if (!src) return '';
            if (src.startsWith('http://') || src.startsWith('https://') || src.startsWith('data:')) return src;
            if (src.startsWith('./gallery/')) return src;
            if (src.startsWith('gallery/')) return `./${src}`;
            if (src.startsWith('/gallery/')) return `.${src}`;
            if (src.startsWith('./')) return `./gallery/${src.slice(2).replace(/^\/+/, '')}`;
            if (src.startsWith('/')) return `./gallery/${src.replace(/^\/+/, '')}`;
            return `./gallery/${src}`;
        }

        async function loadFromManifest() {
            const res = await fetch('./gallery/manifest.json', { cache: 'no-store' });
            if (!res.ok) throw new Error('manifest missing');
            const data = await res.json();
            const files = Array.isArray(data) ? data : (Array.isArray(data.images) ? data.images : []);
            return files
                .map((item) => {
                    if (typeof item === 'string') {
                        return { src: item, lore: null };
                    }
                    if (item && typeof item === 'object' && typeof item.src === 'string') {
                        return {
                            src: item.src,
                            lore: item.lore || null
                        };
                    }
                    return null;
                })
                .filter(Boolean)
                .filter((item) => IMAGE_EXT_PATTERN.test(item.src));
        }

        async function loadFromDirectoryListing() {
            const res = await fetch('./gallery/', { cache: 'no-store' });
            if (!res.ok) throw new Error('directory listing unavailable');

            const html = await res.text();
            const doc = new DOMParser().parseFromString(html, 'text/html');
            const links = [...doc.querySelectorAll('a[href]')]
                .map((anchor) => anchor.getAttribute('href') || '')
                .filter((href) => IMAGE_EXT_PATTERN.test(href));

            return [...new Set(links)].map((href) => ({
                src: normalizeGallerySrc(href),
                lore: null
            }));
        }

        function canLoadImage(src) {
            return new Promise((resolve) => {
                const img = new Image();
                img.onload = () => resolve(true);
                img.onerror = () => resolve(false);
                img.src = src;
            });
        }

        async function loadCharacters() {
            let manifestImages = [];
            let directoryImages = [];

            try {
                manifestImages = await loadFromManifest();
            } catch {
                manifestImages = [];
            }

            try {
                directoryImages = await loadFromDirectoryListing();
            } catch {
                directoryImages = [];
            }

            const mergedMap = new Map();
            [...directoryImages, ...manifestImages].forEach((item) => {
                const src = normalizeGallerySrc(item.src);
                if (!src || !IMAGE_EXT_PATTERN.test(src)) return;

                const existing = mergedMap.get(src) || { src, lore: null };
                mergedMap.set(src, {
                    src,
                    lore: item.lore || existing.lore || null
                });
            });

            const images = [...mergedMap.values()];

            const candidateCharacters = images.map((imageData, index) => {
                const src = normalizeGallerySrc(imageData.src);
                const hasCustomLore = Boolean(imageData.lore && String(imageData.lore).trim());
                return {
                    id: index + 1,
                    name: nameFromFilename(src),
                    lore: hasCustomLore ? String(imageData.lore).trim() : fallbackLore(src),
                    hasCustomLore,
                    image: src
                };
            });

            const loadChecks = await Promise.all(
                candidateCharacters.map((char) => canLoadImage(char.image))
            );

            characters = candidateCharacters
                .filter((_, index) => loadChecks[index])
                .map((char, index) => ({
                    ...char,
                    id: index + 1
                }));
        }

        function renderGallery() {
            const grid = document.getElementById('main-grid');
            const count = document.getElementById('variant-count');

            if (!characters.length) {
                grid.innerHTML = '<p style="grid-column:1/-1;padding:20px;border:1px dashed #e8bfd1;border-radius:14px;color:#6e4b6f;">No images found in the gallery folder. Add files to <strong>dora/gallery</strong> or create <strong>dora/gallery/manifest.json</strong>.</p>';
                count.textContent = '0 variants loaded';
                updateDesktopGridAlignment();
                return;
            }

            grid.innerHTML = characters
                .map((char, index) => `
                    <article class="card" style="animation-delay:${index * 80}ms" data-id="${char.id}">
                        <img src="${char.image}" alt="${char.name}" loading="lazy">
                        <div class="card-meta">
                            <h2 class="name">${char.name}</h2>
                        </div>
                    </article>
                `)
                .join('');

            count.textContent = `${characters.length} variants loaded`;

            grid.querySelectorAll('.card').forEach((card) => {
                card.addEventListener('click', () => {
                    openModal(Number(card.dataset.id));
                });
            });

            updateDesktopGridAlignment();
        }

        function updateDesktopGridAlignment() {
            const grid = document.getElementById('main-grid');
            const wrap = document.querySelector('.gallery-wrap');
            if (!grid || !wrap || !characters.length) return;

            const isPhone = window.matchMedia('(max-width: 760px)').matches;    
            if (isPhone) {
                grid.style.columnCount = '';
                grid.style.columnWidth = '';
                grid.style.width = '';
                grid.style.maxWidth = '';
                grid.style.margin = '';
                return;
            }

            // Let CSS handle the column-width and column-gap initially, reset width
            grid.style.columnCount = '';
            grid.style.columnWidth = '';
            grid.style.width = 'auto';
            grid.style.maxWidth = '100%';

            // Wait a microtask to let browser calculate layout
            setTimeout(() => {
                const items = Array.from(grid.children);
                if (!items.length) return;

                const gap = parseFloat(window.getComputedStyle(grid).columnGap) || 12;
                const cardWidth = items[0].offsetWidth;

                // Determine actual number of columns rendered by checking X coordinates
                const xPositions = new Set();
                items.forEach(item => {
                    xPositions.add(Math.round(item.getBoundingClientRect().left));
                });

                const actualCols = xPositions.size;
                
                if (actualCols > 0) {
                    const realWidth = (actualCols * cardWidth) + ((actualCols - 1) * gap);
                    grid.style.width = `${realWidth}px`;
                    grid.style.margin = '0 auto';
                }
            }, 0);

        }

        function openModal(id) {
            const char = characters.find((item) => item.id === id);
            if (!char) return;

            document.getElementById('modal-img').src = char.image;
            document.getElementById('modal-img').alt = char.name;
            document.getElementById('modal-name').textContent = char.name;
            document.getElementById('modal-lore').textContent = char.lore;

            const dialog = document.querySelector('.dialog');
            if (dialog) {
                dialog.classList.toggle('no-lore', !char.hasCustomLore);
            }

            const modal = document.getElementById('modal');
            modal.classList.remove('hidden');
            modal.setAttribute('aria-hidden', 'false');
            document.body.style.overflow = 'hidden';
        }

        function closeModal() {
            const modal = document.getElementById('modal');
            modal.classList.add('hidden');
            modal.setAttribute('aria-hidden', 'true');
            document.body.style.overflow = '';
        }

        document.getElementById('modal-close').addEventListener('click', closeModal);

        document.getElementById('modal').addEventListener('click', (event) => {
            if (event.target.id === 'modal') closeModal();
        });

        document.addEventListener('keydown', (event) => {
            if (event.key === 'Escape') closeModal();
        });

        window.addEventListener('resize', () => {
            updateDesktopGridAlignment();
        });

        (async () => {
            await loadCharacters();
            renderGallery();
        })();
    </script>
</body>
</html>
