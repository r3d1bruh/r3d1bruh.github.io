<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        font-family: Arial, sans-serif;
        background: #fff;
        display: grid;
        place-items: center;
      }
      .wrap {
        text-align: center;
        width: min(92vw, 640px);
      }
      img {
        width: 276px;
        max-width: 70%;
        margin-bottom: 18px;
      }
      input[type='text'] {
        width: 100%;
        padding: 10px 12px;
        border: 1px solid #dfe1e5;
        border-radius: 24px;
        font-size: 16px;
        outline: none;
      }
      .buttons {
        margin-top: 14px;
      }
      button {
        margin: 0 4px;
        padding: 8px 14px;
        border: 1px solid #dadce0;
        background: #f8f9fa;
        cursor: pointer;
      }
    </style>
  </head>
  <body>
    <form class="wrap" action="https://www.google.com/search" method="get">
      <img src="./Google_files/logo.gif" alt="Google" />
      <input type="text" name="q" aria-label="Search" autofocus />
      <div class="buttons">
        <button type="submit">Google Search</button>
        <button type="submit" name="btnI" value="1">I'm Feeling Lucky</button>
      </div>
    </form>
  </body>
</html>
